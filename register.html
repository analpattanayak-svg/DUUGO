<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | DUUGO</title>
<meta name="description" content="DUUGO – Healthcare, Just a Tap Away. Demo doctor appointment and ambulance booking UI.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/images/icon.png">
</head>
<body data-page="register">
<div id="site-nav"></div>
<section class="section"><div class="container"><div class="card p-4 auth-card"><h3 class="text-center">Create your account</h3><p class="text-center text-muted small">Saved only in this browser (demo).</p>
<form id="regForm" novalidate><div class="mb-3"><label class="form-label">Full name</label><input id="rname" class="form-control" data-rule="required"><div class="invalid-feedback">Enter your name.</div></div>
<div class="mb-3"><label class="form-label">Email</label><input id="remail" class="form-control" data-rule="email"><div class="invalid-feedback">Enter a valid email.</div></div>
<div class="mb-3"><label class="form-label">Mobile</label><input id="rmobile" maxlength="10" class="form-control" data-rule="mobile"><div class="invalid-feedback">Enter a valid 10-digit number.</div></div>
<div class="mb-3"><label class="form-label">Password</label><input id="rpass" type="password" class="form-control" data-rule="pass"><div class="invalid-feedback">At least 6 characters.</div></div>
<div class="mb-3"><label class="form-label">Confirm password</label><input type="password" class="form-control" data-rule="match" data-match="#rpass"><div class="invalid-feedback">Passwords do not match.</div></div>
<button class="btn btn-duugo w-100">Register</button></form><p class="text-center small mt-3 mb-0">Have an account? <a href="login.html">Login</a></p></div></div></section>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
